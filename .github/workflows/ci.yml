name: PR Validation (no deploy)

on:
  pull_request:
    branches: [main, docs/pr-00-consolidacao-g4, feat/pr-01-fundacao-estatica, feat/pr-02-hero-a-visual, chore/pr-03-implementation-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-foundation:
    name: Lint, build, tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: npm run lint
      - name: Static export
        run: npm run build
      - name: Tests
        run: npm test
      - name: Accessibility and route invariants
        run: npm run check
      - name: Real browser QA at 1440/390/768/360
        run: npm run qa:browser
      - name: Attach browser evidence, not site deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-evidence
          path: artifacts/qa-browser/
          if-no-files-found: warn
      # No hosting, pages, or dist/ deployment.
