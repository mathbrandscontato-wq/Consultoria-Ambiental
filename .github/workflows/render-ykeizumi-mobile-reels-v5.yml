name: Render Ykeizumi Mobile Reels V5.1 Timeline
on:
  push:
    branches:
      - feat/ykeizumi-mobile-reels-v5-1-timeline
    paths:
      - .github/workflows/render-ykeizumi-mobile-reels-v5.yml
      - motion/ykeizumi-mobile-reels/src/index.tsx
      - motion/ykeizumi-mobile-reels/capture/capture-mobile-v5.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ykeizumi-mobile-v5-1-timeline
  cancel-in-progress: true

jobs:
  render-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original website only locally; do not deploy
        run: npm run build
      - name: Serve authentic Ykeizumi mobile DOM
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/ykeizumi-v5.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/ykeizumi-v5.log
          exit 1
      - name: Install isolated Remotion dependencies
        working-directory: motion/ykeizumi-mobile-reels
        run: npm ci --no-audit --no-fund
      - name: Install authentic browser capture and video validators
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Measure the real HERO VIDEO and capture alpha DOM layers and interactions
        working-directory: motion/ykeizumi-mobile-reels
        run: node capture/capture-mobile-v5.mjs
      - name: Validate geometry, native text isolation and interaction states
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image
          root=Path('motion/ykeizumi-mobile-reels')
          m=json.loads((root/'public/v5-layer-manifest.json').read_text())
          r=m['heroVideo']['video'];c=m['heroVideo']['container']
          assert m['frames']==705 and m['offset']==135 and m['fps']==30
          assert m['viewport']=={'w':390,'h':844,'dpr':3}
          assert 250<r['w']<390 and 350<r['h']<844,r
          assert .35<r['w']/r['h']<1.15,r
          assert all(abs(r[k]-c[k])<1 for k in ('x','y','w','h'))
          assert m['heroVideo']['effectiveRadius']>0
          assert m['photoSuppressedOnlyInCapture'] and m['components']['hiddenPhoto']
          assert m['components']['services']==3 and m['components']['gallery']>=3
          assert not m['errors'],m['errors']
          assert len(m['layers'])==18 and len(m['scrollTrack'])==705
          assert len(m['layers']['introHeading']['lines'])>=3,m['layers']['introHeading']['lines']
          required=['menu-open','menu-close','sector-second','sector-third','gallery-next-1','gallery-next-2']
          assert [x['purpose'] for x in m['touches']]==required,m['touches']
          assert m['touches'][0]['frame']>100
          states={s['frame']:s for s in m['stateTrack']}
          assert states[354]['sector']!=states[356]['sector'],states
          assert states[420]['sector']!=states[422]['sector'],states
          for key,v in m['layers'].items():
            image=Image.open(root/'public'/v['file'])
            assert image.mode=='RGBA',(key,image.mode)
            assert image.getchannel('A').getextrema()[1]>0,(key,'no visible pixels')
            if key not in ('heroCTA','galleryFirstCard'):
              assert image.getchannel('A').getextrema()[0]<255,(key,'opaque layer background')
          source=root/'public/mobile-capture-v5.mp4'
          v=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'stream=width,height,r_frame_rate:format=duration','-of','json',str(source)]))
          stream=next(x for x in v['streams'] if x.get('width'))
          assert (stream['width'],stream['height'])==(1170,2532)
          assert stream['r_frame_rate']=='30/1'
          assert abs(float(v['format']['duration'])-23.5)<.07
          print('Original real HERO video geometry:',r,'radius:',m['heroVideo']['effectiveRadius'])
          print('Native alpha elements:',len(m['layers']),'three original introduction lines and six real touches PASS')
          PY
      - name: Produce per-scene test renders before the final video
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          mkdir -p ../../release/v5-previews
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/01_Opening.mp4 --frames=0-134 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/02_Hero.mp4 --frames=135-284 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/03_Introduction.mp4 --frames=285-344 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/04_Services.mp4 --frames=345-434 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/05_Accordions.mp4 --frames=435-629 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
          npx remotion render src/index.tsx YkeizumiMobileReels ../../release/v5-previews/06_Gallery.mp4 --frames=630-839 --scale=0.5 --codec h264 --crf 21 --concurrency 3 --browser-executable "$CHROME"
      - name: Inspect preview metadata and decode all scene segments
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          previews=sorted(Path('release/v5-previews').glob('*.mp4'))
          assert len(previews)==6,previews
          for f,count in zip(previews,[135,150,60,90,195,210]):
            meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
              '-show_entries','stream=width,height,r_frame_rate:format=duration','-of','json',str(f)]))
            v=next(v for v in meta['streams'] if v.get('width'))
            assert (v['width'],v['height'])==(540,960)
            assert v['r_frame_rate']=='30/1'
            assert abs(float(meta['format']['duration'])-count/30)<.07,(f,meta)
            subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(f),'-f','null','-'],check=True)
          print('Six independent director scene previews: PASS')
          PY
      - name: Render storyboard stills at opening and transition keyframes
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          mkdir -p ../../release/v5-stills
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for FRAME in 0 35 68 83 99 105 124 135 145 160 181 213 245 275 285 310 324 344 345 375 402 434 435 495 518 558 585 629 630 665 684 711 729 755 803 839; do
            npx remotion still src/index.tsx YkeizumiMobileReels ../../release/v5-stills/frame-$FRAME.png --frame=$FRAME --browser-executable "$CHROME" > /dev/null
          done
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          files=sorted(Path('../../release/v5-stills').glob('frame-*.png'),key=lambda p:int(p.stem.split('-')[1]))
          assert len(files)==36
          cols,W,H=9,180,320
          canvas=Image.new('RGB',(cols*W,4*(H+24)),(237,238,235))
          d=ImageDraw.Draw(canvas)
          for i,f in enumerate(files):
            im=Image.open(f).convert('RGB').resize((W,H),Image.Resampling.LANCZOS)
            x=(i%cols)*W;y=(i//cols)*(H+24)
            canvas.paste(im,(x,y));d.text((x+5,y+H+4),f.stem,fill=(20,30,25))
          canvas.save('../../release/Ykeizumi_Mobile_Reels_V5_1_Storyboard.png')
          PY
      - name: Render 28-second master H264 after test scenes and storyboard
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx remotion render src/index.tsx YkeizumiMobileReels \
            ../../release/Ykeizumi_Mobile_Reels_V5_1_Timeline_DirectorsCut.mp4 \
            --codec h264 --crf 16 --concurrency 2 --browser-executable "$CHROME"
      - name: Extract final cover and temporal contact sheet
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 00:00:07.000 \
            -i release/Ykeizumi_Mobile_Reels_V5_1_Timeline_DirectorsCut.mp4 \
            -frames:v 1 release/Ykeizumi_Mobile_Reels_V5_1_Cover.png
          ffmpeg -hide_banner -loglevel error -y \
            -i release/Ykeizumi_Mobile_Reels_V5_1_Timeline_DirectorsCut.mp4 \
            -vf "fps=1/1,scale=180:320,tile=7x4" \
            -frames:v 1 -update 1 release/Ykeizumi_Mobile_Reels_V5_1_Review.png
      - name: Full decode and final metadata QA with technical report
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          mp4=Path('release/Ykeizumi_Mobile_Reels_V5_1_Timeline_DirectorsCut.mp4')
          assert mp4.stat().st_size>1000000
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'stream=codec_name,width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(mp4)]))
          s=next(x for x in probe['streams'] if x.get('codec_name')=='h264')
          assert (s['width'],s['height'])==(1080,1920) and s['r_frame_rate']=='30/1',s
          assert int(s.get('nb_frames',840))==840,s
          assert abs(float(probe['format']['duration'])-28.0)<.07
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(mp4),'-f','null','-'],check=True)
          manifest=json.loads(Path('motion/ykeizumi-mobile-reels/public/v5-layer-manifest.json').read_text())
          assert len(manifest['layers'])==18 and manifest['photoSuppressedOnlyInCapture'] and not manifest['errors']
          files=['Ykeizumi_Mobile_Reels_V5_1_Cover.png','Ykeizumi_Mobile_Reels_V5_1_Review.png',
            'Ykeizumi_Mobile_Reels_V5_1_Storyboard.png']
          for n in files: assert (Path('release')/n).stat().st_size>20000,n
          report=[
            '# Math Brands | Ykeizumi Mobile Reels V5.1 — Technical QA','',
            '## Verified deliverables',
            '- H264 1080x1920, 30 fps, 840 frames, 28.0 seconds — PASS',
            '- Full FFmpeg decode, six independent scene previews and their decode — PASS',
            '- 36 high-resolution transition test frames in storyboard — GENERATED',
            '- Original Chromium mobile 390x844 DPR3; full source video + natural mobile interactions.',
            '- Hero video actual measured rectangle: '+json.dumps(manifest['heroVideo'],ensure_ascii=False),
            '- Hero vector projected in final pixel coordinates; radius only morphs after zoom-in.',
            '- '+str(len(manifest['layers']))+' original DOM layers, with clean base capture and real logo/font/content.',
            '- Three original intro line masks; three service card reveals, original gallery and two accordion selections.',
            '- Six original touches: '+', '.join(t['purpose'] for t in manifest['touches']),
            '- Giant sector photography suppressed only in recording; deployed website untouched.','',
            '## Timeline',
            '- 0-135 opening; 135-285 Hero; 285-345 Intro; 345-435 Services;',
            '- 435-630 original accordions; 630-840 gallery.','',
            '## Creative verification',
            'Automated QA is not a replacement for reviewing full video rhythm, pixel geometry and readability.',
            'Director approval remains pending.','',
            '## Source',
            '- motion/ykeizumi-mobile-reels/src/index.tsx',
            '- motion/ykeizumi-mobile-reels/capture/capture-mobile-v5.mjs',
            '- motion/ykeizumi-mobile-reels/public/v5-layer-manifest.json',
            '- motion/ykeizumi-mobile-reels/public/v5-layers/*.png',
            '- motion/ykeizumi-mobile-reels/public/mobile-capture-v5.mp4',
          ]
          Path('release/Ykeizumi_Mobile_Reels_V5_1_QA.md').write_text('\n'.join(report)+'\n')
          print('V5.1 FINAL QA PASSED',{'bytes':mp4.stat().st_size,'frames':s['nb_frames']})
          PY
      - name: Upload final, original DOM layers, source and scene previews
        uses: actions/upload-artifact@v4
        with:
          name: Ykeizumi-Mobile-Reels-V5-1-Timeline
          retention-days: 30
          if-no-files-found: error
          path: |
            release/Ykeizumi_Mobile_Reels_V5_1_*
            release/v5-previews/*.mp4
            motion/ykeizumi-mobile-reels/src/index.tsx
            motion/ykeizumi-mobile-reels/capture/capture-mobile-v5.mjs
            motion/ykeizumi-mobile-reels/package.json
            motion/ykeizumi-mobile-reels/package-lock.json
            motion/ykeizumi-mobile-reels/public/mobile-capture-v5.mp4
            motion/ykeizumi-mobile-reels/public/v5-layer-manifest.json
            motion/ykeizumi-mobile-reels/public/v5-layers/*.png
            motion/ykeizumi-mobile-reels/capture-report-v5.json
      - name: Commit deliverables exclusively to independent V5 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Ykeizumi_Mobile_Reels_V5_1_* \
            release/v5-previews/*.mp4 \
            motion/ykeizumi-mobile-reels/public/mobile-capture-v5.mp4 \
            motion/ykeizumi-mobile-reels/public/v5-layer-manifest.json \
            motion/ykeizumi-mobile-reels/public/v5-layers \
            motion/ykeizumi-mobile-reels/capture-report-v5.json
          git commit -m "chore(motion-v5): 28s full master, six previews and native DOM layers [skip ci]" || true
          git push origin HEAD:feat/ykeizumi-mobile-reels-v5-1-timeline
