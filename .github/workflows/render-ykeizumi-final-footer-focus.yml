name: Ykeizumi V6.4 FINAL — Footer Focus Render From Verified Source
on:
  push:
    branches:
      - feat/ykeizumi-mobile-reels-v6-4-final-footer-focus
    paths:
      - .github/workflows/render-ykeizumi-final-footer-focus.yml
      - motion/ykeizumi-mobile-reels/src/index.tsx
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ykeizumi-final-footer-focus
  cancel-in-progress: true
jobs:
  final-master:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Remotion dependency set and browser
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Confirm source media and foley match approved cut
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          p=Path('motion/ykeizumi-mobile-reels')
          m=json.loads((p/'public/v6-4-layer-manifest.json').read_text())
          assert (m['frames'],m['offset'])==(1100,190)
          assert [x['purpose'] for x in m['touches']]==['sector-second','gallery-next-1','gallery-next-2']
          assert m['footerStates'][-1]['footerVisible']
          assert (p/'public/v6-4-gallery-hold.jpg').stat().st_size>100000
          source=p/'public/mobile-capture-v6-4.mp4'
          music=p/'public/v6-4-music-and-foley.wav'
          assert source.stat().st_size>15000000 and music.stat().st_size>2000000
          print('Verified original source, one sector tap, footer and procedural SFX')
          PY
      - name: Render 1290 true H264 frames, 1080×1920, enhanced footer framing
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          mkdir -p ../../release
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx remotion render src/index.tsx YkeizumiMobileReels \
            ../../release/Ykeizumi_Final_VideoOnly.mp4 \
            --codec=h264 --crf=16 --concurrency=2 --browser-executable "$CHROME"
      - name: Mux the original V6.4 custom typing, click, drag and music bed
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i release/Ykeizumi_Final_VideoOnly.mp4 \
            -i motion/ykeizumi-mobile-reels/public/v6-4-music-and-foley.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac \
            -b:a 160k -ar 48000 -ac 2 -shortest -movflags +faststart \
            release/Ykeizumi_FINAL_Footer_Sound_Loop.mp4
          rm release/Ykeizumi_Final_VideoOnly.mp4
      - name: Decode full final file and verify footer, duration and optical loop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          import subprocess,json
          video=Path('release/Ykeizumi_FINAL_Footer_Sound_Loop.mp4')
          data=json.loads(subprocess.check_output(['ffprobe','-v','error',
            '-show_entries','stream=codec_name,width,height,r_frame_rate,nb_frames:format=duration',
            '-of','json',str(video)]))
          v=next(x for x in data['streams'] if x.get('codec_name')=='h264')
          assert (v['width'],v['height'])==(1080,1920)
          assert v['r_frame_rate']=='30/1' and int(v['nb_frames'])==1290
          assert abs(float(data['format']['duration'])-43)<.07
          assert any(x.get('codec_name')=='aac' for x in data['streams'])
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(video),'-f','null','-'],check=True)
          shots={}
          for name,t in [('start',0.0),('footer',39.5),('end',42.93)]:
            p=Path('release/inspection_'+name+'.png')
            subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
              '-ss',str(t),'-i',str(video),'-frames:v','1',str(p)],check=True)
            shots[name]=Image.open(p).convert('RGB')
          a,b=shots['start'],shots['end']
          diff=ImageChops.difference(a,b)
          mean=sum(ImageStat.Stat(diff.resize((270,480))).mean)/3
          assert mean<5,('Loop seam fails',mean)
          # With vertical focus, the CTA previously above footer is gone.
          # Actual original footer fills the upper edge, no side crop.
          assert sum(shots['footer'].getpixel((20,20)))<450,'Previous CTA still visible at top'
          assert sum(shots['footer'].getpixel((1055,20)))<450,'Footer is not full-width'
          assert video.stat().st_size>5000000
          print('FINAL MASTER PASSED',data['format']['duration'],video.stat().st_size,'loop_difference',mean)
          PY
      - name: Upload deliverable video only
        uses: actions/upload-artifact@v4
        with:
          name: Ykeizumi-FINAL-Footer-Sound-Loop
          retention-days: 30
          if-no-files-found: error
          path: release/Ykeizumi_FINAL_Footer_Sound_Loop.mp4
      - name: Commit final approved-technical master in isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Ykeizumi_FINAL_Footer_Sound_Loop.mp4
          git commit -m "chore(motion): final Ykeizumi full-width footer focus and seamless Reels loop [skip ci]" || true
          git push origin HEAD:feat/ykeizumi-mobile-reels-v6-4-final-footer-focus
