name: Render Ykeizumi Mobile Reels V4 Directors Cut

on:
  push:
    branches:
      - feat/ykeizumi-mobile-reels-v4-directors-cut
    paths:
      - .github/workflows/render-ykeizumi-mobile-reels-v4.yml
      - motion/ykeizumi-mobile-reels/src/index.tsx
      - motion/ykeizumi-mobile-reels/capture/capture-mobile-v4.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ykeizumi-mobile-reels-v4-directors-cut
  cancel-in-progress: true

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the real mobile website locally (never publish)
        run: npm run build

      - name: Serve local website
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/ykeizumi-v4-server.log 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/ykeizumi-v4-server.log
          exit 1

      - name: Install exact isolated Remotion dependencies
        working-directory: motion/ykeizumi-mobile-reels
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and FFmpeg
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Capture high-density mobile site and real interactions
        working-directory: motion/ykeizumi-mobile-reels
        run: node capture/capture-mobile-v4.mjs

      - name: Validate source capture and geometric projection architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          c=json.loads(Path('motion/ykeizumi-mobile-reels/capture-report-v4.json').read_text())
          assert c['viewport']=={'w':390,'h':844,'dpr':3},c
          assert c['captures']==704 and c['fps']==30,c
          assert c['sourceComponents']['hiddenPhoto'],c
          assert c['imageSuppressedOnlyInCapture'],c
          assert c['videoStatus']['videoWidth']>0 and not c['videoStatus']['paused'],c
          req={'menu-open','menu-close','sector-second','sector-third','gallery-next-1','gallery-next-2'}
          assert req.issubset({x['purpose'] for x in c['touches']}),c
          assert not c['errors'],c['errors']
          code=Path('motion/ykeizumi-mobile-reels/src/index.tsx').read_text()
          assert "function projectedShape" in code and 'vectorPath(p)' in code, 'Screen-space geometry missing'
          assert 'path d={vectorPath(p)}' in code and '<svg width={WIDTH}' in code
          assert 'transform=' not in code.split('</svg>')[0], 'Vector SVG must not be scaled'
          capture=Path('motion/ykeizumi-mobile-reels/public/mobile-capture-v4.mp4')
          assert capture.stat().st_size>1_000_000
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'stream=width,height,r_frame_rate,nb_frames:format=duration','-of','json',str(capture)]))
          v=next(x for x in meta['streams'] if x.get('width'))
          assert (v['width'],v['height'])==(1170,2532),v
          assert v['r_frame_rate']=='30/1',v
          assert abs(float(meta['format']['duration'])-704/30)<0.08,meta
          print('Captured site QA OK:',{'events':len(c['touches']),'video':v,'hiddenPhoto':True})
          PY

      - name: Render original 28s composition H264
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          mkdir -p ../../release
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx remotion render src/index.tsx YkeizumiMobileReels \
            ../../release/Ykeizumi_Mobile_Reels_V4_DirectorsCut.mp4 \
            --codec h264 --crf 16 --concurrency 2 --browser-executable "$CHROME"

      - name: Export cover, visual review sheet and maximal zoom corner frame
        working-directory: motion/ykeizumi-mobile-reels
        run: |
          ffmpeg -hide_banner -loglevel error -y -ss 00:00:06.000 \
            -i ../../release/Ykeizumi_Mobile_Reels_V4_DirectorsCut.mp4 \
            -frames:v 1 ../../release/Ykeizumi_Mobile_Reels_V4_Cover.png
          ffmpeg -hide_banner -loglevel error -y \
            -i ../../release/Ykeizumi_Mobile_Reels_V4_DirectorsCut.mp4 \
            -vf "fps=1/1.4,scale=270:480,tile=5x4" \
            -frames:v 1 -update 1 ../../release/Ykeizumi_Mobile_Reels_V4_Review.png
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npx remotion still src/index.tsx YkeizumiMobileReels \
            ../../release/Ykeizumi_Mobile_Reels_V4_VectorCorner.png \
            --frame=82 --browser-executable "$CHROME"

      - name: Decode all frames, check metadata and write technical handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          prefix=Path('release/Ykeizumi_Mobile_Reels_V4_')
          video=Path('release/Ykeizumi_Mobile_Reels_V4_DirectorsCut.mp4')
          cover=Path('release/Ykeizumi_Mobile_Reels_V4_Cover.png')
          review=Path('release/Ykeizumi_Mobile_Reels_V4_Review.png')
          corner=Path('release/Ykeizumi_Mobile_Reels_V4_VectorCorner.png')
          assert video.stat().st_size>1_000_000
          assert all(p.stat().st_size>15_000 for p in (cover,review,corner))
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
            'stream=codec_name,width,height,r_frame_rate,nb_frames:format=duration',
            '-of','json',str(video)]))
          v=next(x for x in meta['streams'] if x.get('codec_name')=='h264')
          length=float(meta['format']['duration'])
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['r_frame_rate']=='30/1',v
          assert abs(length-28.0)<0.07,length
          assert int(v.get('nb_frames',840))==840,v
          cap=json.loads(Path('motion/ykeizumi-mobile-reels/capture-report-v4.json').read_text())
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-i',str(video),
            '-f','null','-'],check=True)
          lines=[
            '# Ykeizumi | Mobile Reels V4 — Technical QA',
            '',
            '## Output verified by automated render tests',
            '- MP4: H264, 1080×1920, 30 FPS, '+str(round(length,3))+' s, 840 frames.',
            '- Full FFmpeg decode of video: PASS.',
            '- Original website captured in headless mobile Chromium at 390×844, DPR3, 704 source frames.',
            '- Original hero video playback: PASS.',
            '- Real taps: '+', '.join(t['purpose'] for t in cap['touches'])+'.',
            '- Giant photography suppressed ONLY inside the local capture browser: PASS.',
            '- Screen-space SVG projected per output frame; no layer transform applied to vector: source-code check PASS.',
            '- Maximal zoom vector inspection frame: release/Ykeizumi_Mobile_Reels_V4_VectorCorner.png.',
            '- Contact sheet and cover generated from final encoded MP4.',
            '',
            '## Director’s cut adjustments versus V3',
            '- No 13.5× CSS scaling of a browser-composited SVG; explicit vector path coordinates per frame.',
            '- 28s target rather than 29s (4.533s geometric opening + 23.467s original mobile interface).',
            '- Quintic smooth trajectories for corner, radius, zoom and exit; continuous small-scale editorial camera track.',
            '- Original native menu, accordion and responsive gallery events recaptured and rescheduled.',
            '- Single continuous Hermite browser scroll through introduction and services rather than independent stop/start arcs.',
            '- 3× browser capture scale, so the source interface is not enlarged beyond captured pixel dimensions.',
            '- No added labels, ornaments, phone mockups, proprietary fonts, or publication changes.',
            '',
            '## Creative review required',
            '- Automated validation does not certify final cinematic taste, visual pacing or frame-by-frame subjective quality.',
            '- Inspect review sheet, vector maximum, full 28s video and interactions before creative approval.',
            '- No changes to deployed website, and V3 remains accessible in its original branch.',
            '',
            '## Editable assets',
            '- motion/ykeizumi-mobile-reels/src/index.tsx',
            '- motion/ykeizumi-mobile-reels/capture/capture-mobile-v4.mjs',
            '- motion/ykeizumi-mobile-reels/public/mobile-capture-v4.mp4',
            '- motion/ykeizumi-mobile-reels/public/touches-v4.json',
            '- motion/ykeizumi-mobile-reels/capture-report-v4.json',
            ]
          Path('release/Ykeizumi_Mobile_Reels_V4_QA.md').write_text('\n'.join(lines)+'\n')
          print('V4 PASS:',{'duration':length,'bytes':video.stat().st_size,'fps':v['r_frame_rate']})
          PY

      - name: Upload complete V4 package before git write
        uses: actions/upload-artifact@v4
        with:
          name: Ykeizumi-Mobile-Reels-V4-DirectorsCut
          retention-days: 30
          if-no-files-found: error
          path: |
            release/Ykeizumi_Mobile_Reels_V4_DirectorsCut.mp4
            release/Ykeizumi_Mobile_Reels_V4_Cover.png
            release/Ykeizumi_Mobile_Reels_V4_Review.png
            release/Ykeizumi_Mobile_Reels_V4_VectorCorner.png
            release/Ykeizumi_Mobile_Reels_V4_QA.md
            motion/ykeizumi-mobile-reels/src/index.tsx
            motion/ykeizumi-mobile-reels/capture/capture-mobile-v4.mjs
            motion/ykeizumi-mobile-reels/public/mobile-capture-v4.mp4
            motion/ykeizumi-mobile-reels/public/touches-v4.json
            motion/ykeizumi-mobile-reels/capture-report-v4.json
            motion/ykeizumi-mobile-reels/package.json
            motion/ykeizumi-mobile-reels/package-lock.json

      - name: Version output ONLY on isolated V4 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Ykeizumi_Mobile_Reels_V4_* \
            motion/ykeizumi-mobile-reels/public/mobile-capture-v4.mp4 \
            motion/ykeizumi-mobile-reels/public/touches-v4.json \
            motion/ykeizumi-mobile-reels/capture-report-v4.json
          git commit -m "chore(motion-v4): 28s Directors Cut, media and QA artifacts [skip ci]" || true
          git push origin HEAD:feat/ykeizumi-mobile-reels-v4-directors-cut
